<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guess.css">  
  <script defer src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <script defer src="physics.js"></script>
<script defer src="dynamics.js"></script>
<script defer src="guess.js"></script>
  <title>Module 4 - Guess the Sensor</title>
</head>
<body>
  <nav><a href="index.html">01 · Time response</a> · <a href="checkpoint.html">02–03 · Responses & RK4 bonus</a></nav><h1>Guess the Sensor</h1>
  <p>Estimate the sensor parameters from its response curve.</p>
  <section>
  <h2>Unknown Sensor Response</h2>
  <p id="challengeDescription"></p><p id="challengeError" role="alert"></p>
  <div id="sensorPlot"></div>
</section>
  
<section>
  <h2>Your Prediction</h2>

<label for="gainGuess">Sensor Gain (K):</label>
<input type="number" id="gainGuess" min="0.01" step="0.1">

  <label for="tauGuess">Time Constant (τ):</label>
  <input type="number" id="tauGuess" min="0.01" step="0.1">

  <label for="zetaGuess">Damping Ratio (ζ):</label>
  <input type="number" id="zetaGuess" min="0" step="0.1">

  <label for="omegaGuess">Natural Frequency (ωn):</label>
  <input type="number" id="omegaGuess" min="0.01" step="0.1">

  <button id="checkGuess">Check My Guess</button>
 
<button type="button" id="newSensor">New Sensor</button>
<button type="button" id="showHint">Show Hint</button>
<p id="hintText" hidden></p>
<p id="score">Score: 0 / 0</p>
<div id="guessResult" role="status"></div>
  
</section>
</body>
</html>
